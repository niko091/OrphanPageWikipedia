[package]
name = "orphanwiki-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "orphanwiki"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["python"]
python = ["dep:pyo3"]
dashboard = ["dep:wasm-bindgen"]
cli = ["dep:clap"]

[dependencies]
pyo3 = { version = "0.28", optional = true, features = ["extension-module", "abi3-py311"] }

regex = "=1.12.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
wasm-bindgen = { version = "=0.2.105", optional = true }
clap = { version = "=4.6.1", optional = true, default-features = false, features = ["std", "help", "usage", "error-context"] }

[profile.release]
lto = "thin"
codegen-units = 1
