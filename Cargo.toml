[package]
name = "orphanwiki-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "orphanwiki"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["python"]
python = ["dep:pyo3"]
dashboard = ["dep:wasm-bindgen"]
cli = ["dep:clap", "dep:reqwest", "dep:sha1", "dep:sha2", "dep:bzip2", "dep:rusqlite", "dep:flate2", "dep:quick-xml", "dep:cc", "dep:focaccia", "serde_json/float_roundtrip"]

[dependencies]
pyo3 = { version = "0.28", optional = true, features = ["extension-module", "abi3-py311"] }

regex = "=1.12.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
wasm-bindgen = { version = "=0.2.105", optional = true }
clap = { version = "=4.6.1", optional = true, default-features = false, features = ["std", "help", "usage", "error-context"] }
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["blocking", "rustls"] }
sha1 = { version = "=0.10.6", optional = true }
sha2 = { version = "=0.10.9", optional = true }
bzip2 = { version = "=0.6.1", optional = true }
rusqlite = { version = "=0.32.1", optional = true, features = ["backup"] }
flate2 = { version = "=1.1.2", optional = true }
quick-xml = { version = "=0.42.0", optional = true }
focaccia = { version = "=2.0.0", optional = true, default-features = false }

[build-dependencies]
cc = { version = "=1.9.0", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
