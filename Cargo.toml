[package]
name = "orphanwiki"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[lib]
name = "orphanwiki"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "orphanwiki"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
dashboard = ["dep:wasm-bindgen"]
cli = ["dep:clap", "dep:reqwest", "dep:sha1", "dep:sha2", "dep:bzip2", "dep:rusqlite", "dep:flate2", "dep:quick-xml", "dep:cc", "dep:focaccia", "dep:axum", "dep:tokio", "dep:mysql", "dep:futures-util", "dep:rustix", "dep:signal-hook", "dep:nix", "dep:indexmap", "serde_json/float_roundtrip"]

[dependencies]
regex = "=1.13.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
wasm-bindgen = { version = "=0.2.105", optional = true }
clap = { version = "=4.6.1", optional = true, default-features = false, features = ["std", "help", "usage", "error-context"] }
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["blocking", "rustls", "form"] }
sha1 = { version = "=0.10.6", optional = true }
sha2 = { version = "=0.10.9", optional = true }
bzip2 = { version = "=0.6.1", optional = true }
rusqlite = { version = "=0.32.1", optional = true, features = ["backup"] }
flate2 = { version = "=1.1.2", optional = true }
quick-xml = { version = "=0.42.0", optional = true }
focaccia = { version = "=2.0.0", optional = true, default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "signal", "fs", "io-util"], optional = true }
mysql = { version = "=28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls"], optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"], optional = true }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "time", "param", "process", "fs", "thread"], optional = true }
signal-hook = { version = "=0.3.18", optional = true, default-features = false }
nix = { version = "=0.31.3", default-features = false, features = ["resource"], optional = true }
indexmap = { version = "=2.14.2", default-features = false, features = ["serde", "std"], optional = true }

[build-dependencies]
cc = { version = "=1.9.0", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
