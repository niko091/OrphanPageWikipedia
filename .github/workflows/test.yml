name: Tests

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check repository sources
        run: |
          if [ -n "$(git ls-files -- data web/data web/assets)" ]; then
            echo 'Research data or generated assets are tracked.' >&2
            exit 1
          fi
          if git grep -n -E '(/home/|/Users/)' -- orphanwiki scripts src web/src config; then
            echo 'A contributor-specific absolute path was found.' >&2
            exit 1
          fi
      - name: Install Rust components and WebAssembly target
        run: |
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown
      - name: Install build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install 'maturin>=1.12,<2'
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
          npm ci
      - name: Build Python extension
        run: .venv/bin/maturin develop --release --locked
      - name: Check Rust
        run: |
          cargo fmt --check
          cargo test --locked
          cargo test --locked --no-default-features
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
          cargo clippy --locked --no-default-features --features dashboard --target wasm32-unknown-unknown -- -D warnings
      - name: Check Python
        run: .venv/bin/python -m unittest discover -s tests/python -v
      - name: Check TypeScript and browser dashboard
        run: |
          npm run check
          npm test
