name: Elaborazione

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  processing:
    name: Elaborazione
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
        env:
          MARIADB_ROOT_PASSWORD: orphanwiki-local-test
          MARIADB_DATABASE: orphanwiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ORPHANWIKI_TEST_MYSQL_URL: mysql://root:orphanwiki-local-test@127.0.0.1:3306/orphanwiki_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check repository sources
        run: |
          if [ -n "$(git ls-files -- data web/data web/assets)" ]; then
            echo 'Research data or generated assets are tracked.' >&2
            exit 1
          fi
          if [ -n "$(git ls-files -- '*.py' pyproject.toml)" ]; then
            echo 'The production repository must not require Python.' >&2
            exit 1
          fi
          if git grep -n -E '(/home/|/Users/)' -- scripts src web/src config; then
            echo 'A contributor-specific absolute path was found.' >&2
            exit 1
          fi
      - name: Install Rust components
        run: rustup component add clippy rustfmt
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config g++ curl tar
          sh scripts/prepare-fasttext.sh
      - name: Check formatting
        run: cargo fmt --check
      - name: Test native pipeline and editorial databases
        run: cargo test --locked
      - name: Test core without CLI
        run: cargo test --locked --no-default-features
      - name: Lint Rust
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
