[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "orphanwiki"
version = "0.1.0"
description = "Wikipedia orphan analysis from official Wikimedia dumps with Rust and TypeScript"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
topics = ["fasttext==0.9.3", "numpy>=1.26,<3"]

[tool.maturin]
python-source = "."
module-name = "orphanwiki._native"
